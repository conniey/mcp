name: Azure Managed Lustre evaluations
description: Evaluation of prompts in the section Azure Managed Lustre
type: capability
stimuli:
  - name: managedlustre evaluation 0
    prompt: Cancel the autoexport job <job_name> for the Azure Managed Lustre filesystem <filesystem_name> in resource group <resource_group_name>
    agent_environment: ${AGENT_ENVIRONMENT}
    graders:
      - type: tool-calls
        config:
          required:
            - name: managedlustre
              args:
                command: managedlustre_fs_blob_autoexport_cancel
  - name: managedlustre evaluation 1
    prompt: Cancel the autoimport job <job_name> for the Azure Managed Lustre filesystem <filesystem_name> in resource group <resource_group_name>
    agent_environment: ${AGENT_ENVIRONMENT}
    graders:
      - type: tool-calls
        config:
          required:
            - name: managedlustre
              args:
                command: managedlustre_fs_blob_autoimport_cancel
  - name: managedlustre evaluation 2
    prompt: Cancel the one-time import job <job_name> for the Azure Managed Lustre filesystem <filesystem_name> in resource group <resource_group_name>
    agent_environment: ${AGENT_ENVIRONMENT}
    graders:
      - type: tool-calls
        config:
          required:
            - name: managedlustre
              args:
                command: managedlustre_fs_blob_import_cancel
