  - name: managedlustre evaluation 6
    prompt: Create an Azure Managed Lustre filesystem with name <filesystem_name>, size <filesystem_size>, SKU <sku>, and subnet <subnet_id> for availability zone <zone>in location <location>. Maintenance should occur on <maintenance_window_day> at <maintenance_window_time>
    agent_environment: ${AGENT_ENVIRONMENT}
    graders:
      - type: tool-calls
        config:
          required:
            - name: managedlustre
              args:
                command: managedlustre_fs_create
  - name: managedlustre evaluation 7
    prompt: Create an expansion job to increase the storage capacity of the Azure Managed Lustre filesystem <filesystem_name> to <new_size_tib> TiB in resource group <resource_group_name>
